<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1440" width="1080" height="1440">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbfff8"/>
      <stop offset="0.52" stop-color="#eef8f1"/>
      <stop offset="1" stop-color="#fff7f2"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#24362b"/>
      <stop offset="1" stop-color="#101914"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2ee87a"/>
      <stop offset="1" stop-color="#17a856"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="26" stdDeviation="22" flood-color="#203327" flood-opacity="0.18"/>
    </filter>
    <style>
      text {
        font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        letter-spacing: 0;
      }
      .ink { fill: #17211b; }
      .muted { fill: #63716a; }
      .greenText { fill: #128348; }
      .white { fill: #ffffff; }
      .mono { font-family: "SF Mono", "Menlo", monospace; }
    </style>
  </defs>

  <rect width="1080" height="1440" fill="url(#bg)"/>

  <g opacity="0.28">
    <circle cx="940" cy="152" r="86" fill="#ff705f"/>
    <circle cx="124" cy="1218" r="112" fill="#25c66d"/>
    <circle cx="978" cy="1190" r="46" fill="#ffd06a"/>
  </g>

  <g transform="translate(84 92)">
    <rect x="0" y="0" width="168" height="56" rx="28" fill="#ff624f"/>
    <text x="84" y="36" text-anchor="middle" font-size="26" font-weight="700" fill="#ffffff">效率工具</text>
  </g>

  <g transform="translate(84 230)">
    <text x="0" y="0" class="ink" font-size="76" font-weight="900">别再猜 Codex</text>
    <text x="0" y="92" class="ink" font-size="76" font-weight="900">还剩多少额度</text>
    <text x="0" y="156" class="muted" font-size="31" font-weight="600">QuotaBar 把 5h / 7d 用量放进菜单栏</text>
  </g>

  <g transform="translate(90 422)" filter="url(#softShadow)">
    <rect x="0" y="0" width="900" height="552" rx="48" fill="url(#screen)"/>
    <rect x="34" y="32" width="832" height="56" rx="28" fill="#eff6f1"/>
    <circle cx="72" cy="60" r="10" fill="#ff5f57"/>
    <circle cx="104" cy="60" r="10" fill="#ffbd2e"/>
    <circle cx="136" cy="60" r="10" fill="#28c840"/>
    <rect x="512" y="45" width="300" height="30" rx="15" fill="#dce9df"/>
    <text x="662" y="66" text-anchor="middle" class="mono" font-size="21" font-weight="700" fill="#1a2b20">5h 52% | 7d 42%</text>

    <g transform="translate(94 134)">
      <rect x="0" y="0" width="330" height="330" rx="74" fill="#1d3025"/>
      <circle cx="165" cy="148" r="91" fill="#27d26f"/>
      <circle cx="165" cy="148" r="53" fill="#1d3025"/>
      <rect x="87" y="255" width="156" height="23" rx="12" fill="#3b6049"/>
      <rect x="87" y="255" width="112" height="23" rx="12" fill="#27d26f"/>
      <text x="165" y="193" text-anchor="middle" font-size="122" font-weight="900" fill="#f5fff7">Q</text>
    </g>

    <g transform="translate(472 138)">
      <rect x="0" y="0" width="318" height="328" rx="30" fill="#f4fbf6"/>
      <text x="28" y="48" font-size="26" font-weight="800" fill="#18241d">QuotaBar</text>
      <text x="28" y="82" font-size="17" font-weight="700" fill="#718078">Codex 用量 · 只读</text>
      <text x="28" y="169" class="greenText" font-size="88" font-weight="900">52%</text>
      <text x="214" y="162" font-size="18" font-weight="800" fill="#26362d">5h</text>
      <text x="214" y="193" font-size="18" font-weight="800" fill="#26362d">remaining</text>
      <rect x="28" y="223" width="262" height="16" rx="8" fill="#d8e7dc"/>
      <rect x="28" y="223" width="136" height="16" rx="8" fill="#22c86a"/>
      <rect x="28" y="266" width="262" height="16" rx="8" fill="#d8e7dc"/>
      <rect x="28" y="266" width="110" height="16" rx="8" fill="#22c86a"/>
      <text x="28" y="310" font-size="18" font-weight="700" fill="#65736b">Plan Plus · Reset credits 3</text>
    </g>
  </g>

  <g transform="translate(84 1034)">
    <rect x="0" y="0" width="276" height="86" rx="24" fill="#ffffff" opacity="0.92"/>
    <text x="138" y="37" text-anchor="middle" font-size="25" font-weight="900" class="ink">菜单栏常驻</text>
    <text x="138" y="66" text-anchor="middle" font-size="19" font-weight="700" class="muted">不用点开才知道</text>

    <rect x="318" y="0" width="276" height="86" rx="24" fill="#ffffff" opacity="0.92"/>
    <text x="456" y="37" text-anchor="middle" font-size="25" font-weight="900" class="ink">桌面小组件</text>
    <text x="456" y="66" text-anchor="middle" font-size="19" font-weight="700" class="muted">写代码时瞄一眼</text>

    <rect x="636" y="0" width="276" height="86" rx="24" fill="#ffffff" opacity="0.92"/>
    <text x="774" y="37" text-anchor="middle" font-size="25" font-weight="900" class="ink">只读接口</text>
    <text x="774" y="66" text-anchor="middle" font-size="19" font-weight="700" class="muted">不动账号状态</text>
  </g>

  <g transform="translate(84 1193)">
    <text x="0" y="0" class="ink" font-size="42" font-weight="900">打开电脑先看一眼，</text>
    <text x="0" y="58" class="ink" font-size="42" font-weight="900">今天怎么安排心里有数。</text>
    <text x="0" y="124" class="muted" font-size="26" font-weight="700">适合每天高频用 Codex 写代码的人收藏。</text>
  </g>

  <g transform="translate(84 1351)">
    <rect x="0" y="-10" width="912" height="1" fill="#cad9cf"/>
    <text x="0" y="0" class="greenText" font-size="24" font-weight="800">QuotaBar</text>
    <text x="122" y="0" class="muted" font-size="24" font-weight="700">Codex 用量菜单栏工具</text>
  </g>
</svg>
